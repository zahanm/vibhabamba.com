<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Quiet Time</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" aria-label="Quiet Time Clock">
    <section class="clock-wrap">
      <svg class="clock" viewBox="0 0 300 300" role="img" aria-label="Quiet time visual timer">
        <defs>
          <clipPath id="circleClip">
            <circle cx="150" cy="150" r="126" />
          </clipPath>
          <filter id="softGloss" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur" />
            <feOffset in="blur" dx="0" dy="3" result="offset" />
            <feMerge>
              <feMergeNode in="offset" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <radialGradient id="fluidGradient" cx="36%" cy="22%" r="80%">
            <stop offset="0%" stop-color="#3d4147" />
            <stop offset="36%" stop-color="#111214" />
            <stop offset="100%" stop-color="#030304" />
          </radialGradient>
        </defs>

        <circle class="ring" cx="150" cy="150" r="126" />
        <g clip-path="url(#circleClip)">
          <path id="fluid" class="fluid" filter="url(#softGloss)" />
          <ellipse id="shine" class="shine" cx="98" cy="78" rx="34" ry="12" />
        </g>
      </svg>
    </section>

    <section class="controls" aria-label="Parent controls">
      <button id="startBtn" class="primary">Start quiet time</button>
      <button id="resetBtn" class="secondary">Reset</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
